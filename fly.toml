# fly.toml app configuration file generated for sec-edgar-agent
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "sec-edgar-agent"
primary_region = "sjc"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[mounts]
  source = "sec_data"
  destination = "/app/data"
  initial_size = "3gb"

[env]
  CHROMA_PERSIST_DIR = "/app/data/chroma"
  SQLITE_DB_PATH = "/app/data/job_tracking.db"
  CACHE_DIR = "/app/data/cache"
  LOG_LEVEL = "INFO"
  OPENAI_MODEL = "gpt-4o"
